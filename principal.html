<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="formRegistro">
        <h1>Registro Pacientes</h1>

        <form action="registros.html" method="get">
            <fieldset>
                <legend>Datos Personales</legend>

                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" required placeholder="Escriba su nombre">
                <label for="apellidos">Apellidos</label>
                <input type="text" name="apellidos" id="apellidos" required placeholder="Escriba su apellido completo">
                <label for="sexo">Sexo</label>
                    <input type="radio" name="sexo" id="hombre" value="hombre">Hombre
                    <input type="radio" name="sexo" id="mujer" value="mujer">Mujer
                <label for="fechaNac">Fecha Nacimiento</label>
                <input type="date" name="fechaNac" id="fechaNac" required>
                <label for="direccion">Direccion</label>
                <textarea name="direccion" id="direccion" placeholder="Escriba su direccion"></textarea>
            </fieldset>

            <fieldset>
                <legend>
                    Datos Extra
                </legend>

                <label for="contEnfer">Contactos con alguien enfermo</label>
                <input type="radio" name="contactoEnfermo" id="si" value="si">Si
                <input type="radio" name="contactoEnfermo" id="no" value="no">No
                <input type="radio" name="contactoEnfermo" id="posiblemente" value="posiblemente">Posiblemente
                <label for="">Estuvo enfermo antes</label>
                <input type="radio" name="enfAnt" id="siEnfermo" value="si">Si
                <input type="radio" name="enfAnt" id="noEnfermo" value="no">No

                <label for="">Enfermedades de base</label>
                <input type="checkbox" name="diabetes" id="diabetes" value="diabetes">Diabetes
                <input type="checkbox" name="renal" id="renal" value="renal">Enfermedad Renal
                <input type="checkbox" name="hepatica" id="hepatica" value="hepatica">Enfermedad Hepatica
                <input type="checkbox" name="otro" id="otro" value="otro">Otro
            </fieldset>

            <fieldset>
                <legend>
                    Datos Generados
                </legend>
                    <label for="temperatura">Temperatura</label>
                    <input type="text" name="temperatura" id="temperatura" required placeholder="Escriba la temperatura">
                    <label for="tipoExamen">Tipo Examen</label>
                    <select name="tipoExamen" id="tipoExamen">
                        <option value="isopado">Isopado</option>
                        <option value="prueba_molecular">Prueba molecular</option>
                        <option value="prueba_antigenos">Prueba de antigenos</option>
                    </select>
            </fieldset>
            <input type="submit" value="Enviar">
            <input type="reset" value="Cancelar">
        </form>
    </div>
</body>
</html>
